name: Weekly Summary Issue
on:
  schedule:
    - cron: '0 7 * * 1,4'   # Mon & Thu
  workflow_dispatch:
jobs:
  issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open summary issue
        env:
          # PAT with "repo" scope; GITHUB_TOKEN issues are authored by a bot and won't count for you
          GH_TOKEN: ${{ secrets.PROFILE_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          log=.activity/health.log
          touch "$log"
          total=$(grep -c 'status=' "$log" || true)
          fails=$(grep -c 'status=fail' "$log" || true)
          {
            echo "Health check summary as of $(date -u +%F)."
            echo
            echo "- Runs logged: ${total:-0}"
            echo "- Failures: ${fails:-0}"
            echo
            echo '```'
            tail -n 7 "$log" || true
            echo '```'
          } > body.md
          gh issue create --title "Test health summary $(date -u +%F)" --body-file body.md
